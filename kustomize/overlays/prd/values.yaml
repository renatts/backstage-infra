# Prd environment overrides

backstage:
  replicas: 2

  image:
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  startupProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 2

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  pdb:
    create: true
    minAvailable: 1

  appConfig:
    app:
      baseUrl: https://backstage.example.com  # Replace

    backend:
      baseUrl: https://backstage.example.com  # Replace
      listen:
        port: 7007
      cors:
        origin: https://backstage.example.com  # Replace
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}

    auth:
      environment: production
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: false

  extraEnvVars:
    - name: POSTGRES_HOST
      valueFrom:
        secretKeyRef:
          name: backstage-postgres-secret
          key: host
    - name: POSTGRES_PORT
      valueFrom:
        secretKeyRef:
          name: backstage-postgres-secret
          key: port
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: backstage-postgres-secret
          key: username
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: backstage-postgres-secret
          key: password

serviceAccount:
  create: false
  name: backstage
  automountServiceAccountToken: true

postgresql:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: backstage.example.com  # Replace
  tls:
    enabled: true
    secretName: backstage-tls
