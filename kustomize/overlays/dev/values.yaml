# Dev environment — targeted at a local kind cluster.

backstage:
  replicas: 1

  image:
    registry: docker.io
    repository: renatts/backstage-app
    tag: latest
    pullPolicy: Always

  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  startupProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 2

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  appConfig:
    app:
      baseUrl: http://backstage.127.0.0.1.nip.io
    backend:
      baseUrl: http://backstage.127.0.0.1.nip.io
      listen:
        port: 7007
        host: 0.0.0.0
      cors:
        origin: http://backstage.127.0.0.1.nip.io
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: better-sqlite3
        connection: ':memory:'
    auth:
      environment: development
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

serviceAccount:
  create: false
  name: backstage
  automountServiceAccountToken: true

postgresql:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: backstage.127.0.0.1.nip.io
  tls:
    enabled: false
