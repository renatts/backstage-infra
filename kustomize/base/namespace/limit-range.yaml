apiVersion: v1
kind: LimitRange
metadata:
  name: backstage-limits
  namespace: backstage  # set by overlay namespace field
spec:
  limits:
    - type: Container
      # Applied when a container doesn't specify resources
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      # Hard caps per container
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi
    - type: Pod
      max:
        cpu: "4"
        memory: 4Gi
    - type: PersistentVolumeClaim
      max:
        storage: 20Gi
      min:
        storage: 1Gi
