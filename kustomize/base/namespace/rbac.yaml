apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage
  namespace: backstage  # set by overlay namespace field
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/managed-by: argocd
rules:
  # Backstage reads app-config from ConfigMaps and secrets from Secrets
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Kubernetes plugin: read cluster workloads for the catalog
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage
  namespace: backstage  # set by overlay namespace field
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/managed-by: argocd
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage  # set by overlay namespace field
roleRef:
  kind: Role
  name: backstage
  apiGroup: rbac.authorization.k8s.io
